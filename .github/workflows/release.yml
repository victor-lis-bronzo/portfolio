name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v1.2.0)"
        required: true
      skip_verify:
        description: "Skip the verify job"
        type: boolean
        default: false
      confirm:
        description: 'Type "yes" to confirm this manual deploy'
        required: true

concurrency:
  group: release-web-production
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Validate manual confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "yes" ]; then
            echo "::error::Confirmação obrigatória: informe confirm=yes para prosseguir"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve and validate tag
        id: resolve
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' não segue o padrão SemVer vX.Y.Z"
            exit 1
          fi

          git fetch --force --tags origin

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' não existe no repositório"
            exit 1
          fi

          TYPE=$(git cat-file -t "$TAG")
          if [ "$TYPE" != "tag" ]; then
            echo "::error::Tag '$TAG' precisa ser uma tag anotada (git tag -a), encontrado tipo: $TYPE"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    if: ${{ !inputs.skip_verify }}
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.resolve.outputs.tag }}

  deploy:
    needs: [resolve, verify]
    if: |
      always() &&
      needs.resolve.result == 'success' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifacts to production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check on deployed URL
        run: |
          URL="${{ needs.deploy.outputs.url }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "::error::Smoke test falhou: $URL retornou HTTP $STATUS"
            exit 1
          fi
          echo "Smoke test OK: $URL retornou HTTP $STATUS"
