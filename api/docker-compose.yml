services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp_api
    restart: always
    environment:
      - PORT=3001
      - NODE_ENV=production
    expose:
      - "3001"

  nginx:
    image: nginx:alpine
    container_name: mcp_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
