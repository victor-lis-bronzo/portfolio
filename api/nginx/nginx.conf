events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    upstream mcp_api {
        server api:3001;
    }

    server {
        listen 80;
        server_name mcp.victorlisbronzo.me;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name mcp.victorlisbronzo.me;

        ssl_certificate     /etc/letsencrypt/live/mcp.victorlisbronzo.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mcp.victorlisbronzo.me/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://mcp_api;
            proxy_http_version 1.1;

            # Configurações cruciais para Server-Sent Events (SSE) do protocolo MCP
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
