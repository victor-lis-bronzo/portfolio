events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    upstream mcp_api {
        server api:3001;
    }

    server {
        listen 80;
        server_name mcp.victorlisbronzo.me localhost;

        # Suporte a requisições CORS no proxy reverso
        location / {
            proxy_pass http://mcp_api;
            proxy_http_version 1.1;

            # Configurações cruciais para Server-Sent Events (SSE) do protocolo MCP
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Desativa buffering e cache para SSE contínuo sem timeout
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
